<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT | EBTEHAJ GHANADZADEH</title>
  <meta name="description" content="Inquiry and contact page for Ebtehaj Ghanadzadeh — Exhibition bookings, print acquisitions, and correspondence.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">
    
    <!-- Global Header -->
    <header class="site-header">
      <h1 class="artist-title"><a href="index.html">EBTEHAJ GHANADZADEH</a></h1>
      <span class="photography-badge">PHOTOGRAPHY</span>
    </header>

    <!-- Global Layout -->
    <div class="site-layout">
      
      <!-- Left Sidebar Navigation -->
      <nav class="sidebar" aria-label="Primary Navigation">
        <ul class="nav-list">
          <li class="nav-item"><a href="biography.html" class="nav-link">BIOGRAPHY</a></li>
          <li class="nav-item"><a href="exhibitions.html" class="nav-link">EXHIBITIONS</a></li>
          <li class="nav-item"><a href="collections.html" class="nav-link">COLLECTIONS</a></li>
          <li class="nav-item"><a href="contact.html" class="nav-link active">CONTACT</a></li>
        </ul>

        <div class="sidebar-social">
          <a href="https://instagram.com/ebtehaj.ghanadzadeh" target="_blank" rel="noopener" class="instagram-btn" aria-label="Instagram">
            <svg class="instagram-svg" viewBox="0 0 24 24">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
          </a>
        </div>
      </nav>

      <!-- Contact Content Area -->
      <main class="content-area">
        <section class="contact-wrapper">
          
          <div class="contact-email-row">
            <a href="mailto:info@ebtehajphotography.com" class="direct-email">info@ebtehajphotography.com</a>
          </div>

          <form id="contact-form" class="contact-form" action="#" method="POST">
            <label for="contact-message-input" class="form-label">massges:</label>
            
            <textarea 
              id="contact-message-input" 
              name="message" 
              class="messages-textarea-box" 
              placeholder="Write your message here..."
              required
            ></textarea>

            <div class="contact-form-footer">
              <input 
                type="email" 
                name="email" 
                class="contact-input" 
                placeholder="your.email@domain.com" 
                required 
              />
              <button type="submit" class="btn-send">SEND</button>
            </div>
            
            <div id="contact-feedback" class="form-feedback" role="status"></div>
          </form>

        </section>
      </main>

    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
