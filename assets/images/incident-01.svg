<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-incid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#2d2d2d" />
    </linearGradient>
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
      <circle cx="20" cy="20" r="0.5" fill="#ffffff" opacity="0.08"/>
      <circle cx="60" cy="80" r="0.5" fill="#ffffff" opacity="0.06"/>
      <circle cx="80" cy="40" r="0.5" fill="#ffffff" opacity="0.07"/>
      <circle cx="40" cy="60" r="0.5" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#grad-incid)" />
  <rect width="800" height="800" fill="url(#grain)" />

  <!-- Subtle Minimalist Framing -->
  <rect x="30" y="30" width="740" height="740" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />

  <!-- Abstract Cinematic Composition -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#ffffff" stroke-width="1" opacity="0.15" stroke-dasharray="4,8" />
  <circle cx="400" cy="360" r="120" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12" />
  <rect x="260" y="220" width="280" height="280" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.08" />

  <!-- Typography / Artwork Identity -->
  <text x="400" y="350" fill="#ffffff" opacity="0.85" font-family="'Space Mono', 'Courier New', monospace" font-size="14" letter-spacing="4" text-anchor="middle">EBTEHAJ GHANADZADEH</text>
  <text x="400" y="385" fill="#ffffff" opacity="0.5" font-family="'Space Mono', 'Courier New', monospace" font-size="11" letter-spacing="3" text-anchor="middle">THE INCIDENT THAT NEVER HAPPENED</text>
  
  <text x="400" y="680" fill="#ffffff" opacity="0.4" font-family="'Space Mono', 'Courier New', monospace" font-size="10" letter-spacing="2" text-anchor="middle">FRAME I — THE UNSPOKEN ACCORD</text>
  <text x="400" y="710" fill="#ffffff" opacity="0.25" font-family="'Space Mono', 'Courier New', monospace" font-size="9" letter-spacing="1.5" text-anchor="middle">120 × 120 CM • ARCHIVAL PRINT</text>
</svg>